  <circle cx="691.4" cy="126.8"
          r="3"
          fill="#a78bfa"
          opacity="0.35">
    <animate attributeName="opacity"
             values="0.35;0.35;1;0.35;0.35"
             keyTimes="0;0.04;0.06;0.10;1"
             dur="8s"
             begin="1.40s"
             repeatCount="indefinite"/>
  </circle>

  <circle cx="659.7" cy="147.8"
          r="3"
          fill="#a78bfa"
          opacity="0.35">
    <animate attributeName="opacity"
             values="0.35;0.35;1;0.35;0.35"
             keyTimes="0;0.04;0.06;0.10;1"
             dur="8s"
             begin="2.12s"
             repeatCount="indefinite"/>
  </circle>

  <circle cx="655.1" cy="155.7"
          r="3"
          fill="#00d4ff"
          opacity="0.35"/>

  <circle cx="648.2" cy="178.4"
          r="3"
          fill="#00d4ff"
          opacity="0.35"/>

  <circle cx="621.3" cy="193.7"
          r="3"
          fill="#00d4ff"
          opacity="0.35"/>

  <circle cx="618.9" cy="155.7"
          r="3"
          fill="#00d4ff"
          opacity="0.35"/>

  <circle cx="614.3" cy="147.8"
