<svg xmlns="http://www.w3.org/2000/svg" width="850" height="240" viewBox="0 0 850 240">

  <defs>
    <filter id="glow">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Card background -->
  <rect x="0.5" y="0.5" width="849" height="239" rx="12" ry="12"
        fill="#0f1623" stroke="#1a2332" stroke-width="1"/>

  <!-- ================= LEFT : CURRENTLY BUILDING ================= -->

  <text x="45" y="38"
        fill="#64748b"
        font-size="11"
        font-family="monospace"
        letter-spacing="3">
    CURRENTLY BUILDING
  </text>

  <!-- Vertical accent -->
  <line x1="45" y1="58" x2="45" y2="198"
        stroke="#00d4ff"
        stroke-width="1"
        opacity="0.35"/>

  <!-- Data Science -->
  <circle cx="45" cy="75" r="4"
          fill="#a78bfa"
          filter="url(#glow)">
    <animate attributeName="opacity"
             values="0.4;1;0.4"
             dur="2s"
             repeatCount="indefinite"/>
  </circle>

  <text x="62" y="72"
        fill="#a78bfa"
        font-size="11"
        font-family="monospace">
    DATA SCIENCE
  </text>

  <text x="62" y="88"
        fill="#94a3b8"
        font-size="9"
        font-family="monospace">
    Exploring data → insights
  </text>

  <!-- Machine Learning -->
  <circle cx="45" cy="120" r="4"
          fill="#00d4ff"
          filter="url(#glow)">
    <animate attributeName="opacity"
             values="0.4;1;0.4"
             dur="2.5s"
             repeatCount="indefinite"/>
  </circle>

  <text x="62" y="117"
        fill="#00d4ff"
        font-size="11"
        font-family="monospace">
    MACHINE LEARNING
  </text>

  <text x="62" y="133"
        fill="#94a3b8"
        font-size="9"
        font-family="monospace">
    Training → evaluating models
  </text>

  <!-- AI Projects -->
  <circle cx="45" cy="165" r="4"
          fill="#ffb020"
          filter="url(#glow)">
    <animate attributeName="opacity"
             values="0.4;1;0.4"
             dur="3s"
             repeatCount="indefinite"/>
  </circle>

  <text x="62" y="162"
        fill="#ffb020"
        font-size="11"
        font-family="monospace">
    AI PROJECTS
  </text>

  <text x="62" y="178"
        fill="#94a3b8"
        font-size="9"
        font-family="monospace">
    Learning by building
  </text>

  <!-- Small status -->
  <text x="45" y="215"
        fill="#64748b"
        font-size="8"
        font-family="monospace"
        letter-spacing="1">
    STATUS: LEARNING • BUILDING • EXPLORING
  </text>


  <!-- ================= DIVIDER ================= -->

  <line x1="425" y1="25" x2="425" y2="215"
        stroke="#1a2332"
        stroke-width="1"/>


  <!-- ================= RIGHT : FOCUS SECTORS ================= -->

  <text x="460" y="38"
        fill="#64748b"
        font-size="11"
        font-family="monospace"
        letter-spacing="3">
    FOCUS SECTORS
  </text>

  <!-- Radar circles -->
  <circle cx="637" cy="140" r="22"
          fill="none"
          stroke="#64748b"
          stroke-width="0.5"
          stroke-dasharray="3,3"
          opacity="0.25"/>

  <circle cx="637" cy="140" r="44"
          fill="none"
          stroke="#64748b"
          stroke-width="0.5"
          stroke-dasharray="3,3"
          opacity="0.25"/>

  <circle cx="637" cy="140" r="65"
          fill="none"
          stroke="#64748b"
          stroke-width="0.5"
          stroke-dasharray="3,3"
          opacity="0.25"/>

  <!-- Sectors -->
  <path d="M 637 140
           L 638.1 75.0
           A 65 65 0 0 1 693.9 171.5 Z"
        fill="#a78bfa"
        fill-opacity="0.10"
        stroke="#a78bfa"
        stroke-opacity="0.3"
        stroke-width="0.5"/>

  <path d="M 637 140
           L 692.7 173.5
           A 65 65 0 0 1 581.3 173.5 Z"
        fill="#00d4ff"
        fill-opacity="0.10"
        stroke="#00d4ff"
        stroke-opacity="0.3"
        stroke-width="0.5"/>

  <path d="M 637 140
           L 580.1 171.5
           A 65 65 0 0 1 635.9 75.0 Z"
        fill="#ffb020"
        fill-opacity="0.10"
        stroke="#ffb020"
        stroke-opacity="0.3"
        stroke-width="0.5"/>

  <!-- Radar lines -->
  <line x1="637" y1="140"
        x2="637" y2="75"
        stroke="#64748b"
        stroke-width="0.5"
        opacity="0.3"/>

  <line x1="637" y1="140"
        x2="693.3" y2="172.5"
        stroke="#64748b"
        stroke-width="0.5"
        opacity="0.3"/>

  <line x1="637" y1="140"
        x2="580.7" y2="172.5"
        stroke="#64748b"
        stroke-width="0.5"
        opacity="0.3"/>


  <!-- Rotating scanner -->
  <g>

    <path d="M 637 140
             L 604.5 83.7
             A 65 65 0 0 1 637.0 75.0 Z"
          fill="#00d4ff"
          fill-opacity="0.07"/>

    <polygon points="634.5,140 637,75 639.5,140"
             fill="#00d4ff"
             opacity="0.25"/>

    <polygon points="636.2,140 637,75 637.8,140"
             fill="#00d4ff"
             opacity="0.5"/>

    <circle cx="637" cy="75"
            r="2"
            fill="#00d4ff"
            opacity="0.6">

      <animate attributeName="opacity"
               values="0.4;0.8;0.4"
               dur="2s"
               repeatCount="indefinite"/>

    </circle>

    <animateTransform
      attributeName="transform"
      type="rotate"
      from="0 637 140"
      to="360 637 140"
      dur="8s"
      repeatCount="indefinite"/>

  </g>


  <!-- Focus labels -->

  <text x="708.9" y="98.5"
        fill="#a78bfa"
        font-size="9"
        font-family="monospace"
        text-anchor="start"
        dominant-baseline="middle">
    Data Science
  </text>

  <text x="708.9" y="110.5"
        fill="#64748b"
        font-size="8"
        font-family="monospace"
        text-anchor="start"
        dominant-baseline="middle">
    Python • Pandas • NumPy
  </text>


  <text x="637" y="223"
        fill="#00d4ff"
        font-size="9"
        font-family="monospace"
        text-anchor="middle"
        dominant-baseline="middle">
    Machine Learning
  </text>

  <text x="637" y="235"
        fill="#64748b"
        font-size="8"
        font-family="monospace"
        text-anchor="middle"
        dominant-baseline="middle">
    Scikit-learn • Model Evaluation
  </text>


  <text x="565.1" y="98.5"
        fill="#ffb020"
        font-size="9"
        font-family="monospace"
        text-anchor="end"
        dominant-baseline="middle">
    Software Development
  </text>

  <text x="565.1" y="110.5"
        fill="#64748b"
        font-size="8"
        font-family="monospace"
        text-anchor="end"
        dominant-baseline="middle">
    C • Java • OOP • Git
  </text>


  <!-- Animated nodes -->

  <circle cx="641.6" cy="116.4"
          r="3"
          fill="#a78bfa"
          opacity="0.35">
    <animate attributeName="opacity"
             values="0.35;0.35;1;0.35;0.35"
             keyTimes="0;0.04;0.06;0.10;1"
             dur="8s"
             begin="7.94s"
             repeatCount="indefinite"/>
  </circle>

  <circle cx="664.6" cy="111.1"
          r="3"
          fill="#a78bfa"
          opacity="0.35">
    <animate attributeName="opacity"
             values="0.35;0.35;1;0.35;0.35"
             keyTimes="0;0.04;0.06;0.10;1"
             dur="8s"
             begin="0.67s"
             repeatCount="indefinite"/>
